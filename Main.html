<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRUPO 8</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e3a8a, #2563eb);
            color: white;
            overflow: hidden;
        }

        /* Barra de navegación */
        nav {
            width: 100%;
            height: 80px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 8%;
            position: relative;
            z-index: 10;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 35px;
        }

        nav ul li a {
            text-decoration: none;
            color: #ffffff;
            font-size: 16px;
            transition: 0.3s;
        }

        nav ul li a:hover {
            color: #60a5fa;
        }

        /* Contenido principal */
        .hero {
            min-height: calc(100vh - 80px);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            position: relative;
        }

        .contenido {
            max-width: 900px;
            z-index: 2;
        }

        .subtitulo {
            display: inline-block;
            padding: 8px 18px;
            margin-bottom: 25px;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 30px;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);
            font-size: 14px;
            letter-spacing: 2px;
        }

        h1 {
            font-size: clamp(65px, 12vw, 150px);
            font-weight: 900;
            letter-spacing: 8px;
            line-height: 1;
            margin-bottom: 25px;

            background: linear-gradient(
                90deg,
                #ffffff,
                #93c5fd,
                #ffffff
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .descripcion {
            max-width: 650px;
            margin: auto;
            font-size: 19px;
            color: #dbeafe;
            line-height: 1.7;
        }

        .botones {
            margin-top: 40px;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .btn {
            text-decoration: none;
            padding: 14px 30px;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-principal {
            background: white;
            color: #1e40af;
        }

        .btn-principal:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 30px rgba(255,255,255,0.25);
        }

        .btn-secundario {
            border: 1px solid rgba(255,255,255,0.4);
            color: white;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);
        }

        .btn-secundario:hover {
            background: rgba(255,255,255,0.18);
            transform: translateY(-4px);
        }

        /* Decoraciones */
        .circulo {
            position: absolute;
            border-radius: 50%;
            filter: blur(5px);
            opacity: 0.3;
        }

        .circulo1 {
            width: 400px;
            height: 400px;
            background: #3b82f6;
            top: -150px;
            right: -100px;
        }

        .circulo2 {
            width: 300px;
            height: 300px;
            background: #38bdf8;
            bottom: -120px;
            left: -80px;
        }

        .grid {
            position: absolute;
            inset: 0;
            opacity: 0.06;

            background-image:
                linear-gradient(
                    rgba(255,255,255,0.8) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,0.8) 1px,
                    transparent 1px
                );

            background-size: 50px 50px;
        }

        /* Responsive */
        @media (max-width: 700px) {

            nav {
                padding: 0 5%;
            }

            nav ul {
                display: none;
            }

            h1 {
                letter-spacing: 3px;
            }

            .descripcion {
                font-size: 16px;
            }
        }

    </style>
</head>

<body>

    <nav>
        <div class="logo">GRUPO 8</div>

        <ul>
            <li><a href="#">Inicio</a></li>
            <li><a href="#">Nosotros</a></li>
            <li><a href="#">Proyecto</a></li>
            <li><a href="#">Contacto</a></li>
        </ul>
    </nav>


    <main class="hero">

        <div class="grid"></div>

        <div class="circulo circulo1"></div>
        <div class="circulo circulo2"></div>

        <div class="contenido">

            <span class="subtitulo">
                BIENVENIDOS
            </span>

            <h1>GRUPO 8</h1>

            <p class="descripcion">
                Bienvenidos al sitio web del Grupo 8.
                Un espacio donde compartimos nuestros proyectos,
                ideas y soluciones desarrolladas en equipo.
            </p>

            <div class="botones">

                <a href="#" class="btn btn-principal">
                    Ver proyecto
                </a>

                <a href="#" class="btn btn-secundario">
                    Conócenos
                </a>

            </div>

        </div>

    </main>

</body>
</html>
